<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Task Manager</h1>
      <p class="subtitle">Manage your tasks efficiently</p>
    </header>

    <div class="main-content">
      <div class="input-section">
        <input 
          type="text" 
          id="taskTitle" 
          placeholder="What needs to be done?" 
          aria-label="Task title input"
        >
        <textarea 
          id="taskDescription" 
          placeholder="Optional description..." 
          aria-label="Task description input"
        ></textarea>
        <button id="addTaskBtn" aria-label="Add new task">Add Task</button>
      </div>

      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">All Tasks</button>
        <button class="filter-btn" data-filter="incomplete">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <div id="taskList" class="task-list" aria-live="polite">
        <p class="loading">Loading tasks...</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
